name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglm-dev \
            libvulkan-dev \
            xvfb

      - name: Install glslang
        run: |
          git clone --depth 1 --branch 16.0.0 --recurse-submodules \
            https://github.com/KhronosGroup/glslang.git "$RUNNER_TEMP/glslang"
          cmake -S "$RUNNER_TEMP/glslang" -B "$RUNNER_TEMP/glslang/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glslang-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_CTEST=OFF \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DENABLE_OPT=OFF
          cmake --build "$RUNNER_TEMP/glslang/build" -j$(nproc)
          cmake --install "$RUNNER_TEMP/glslang/build"

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/glslang-install"

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run tests
        run: |
          cd build
          xvfb-run ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find include/componeng src/componeng tests example \
          -name "*.hpp" -o -name "*.cpp" | \
          xargs clang-format --dry-run --Werror
      continue-on-error: true

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang-tidy \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglm-dev \
            libvulkan-dev

      - name: Install glslang
        run: |
          git clone --depth 1 --branch 16.0.0 --recurse-submodules \
            https://github.com/KhronosGroup/glslang.git "$RUNNER_TEMP/glslang"
          cmake -S "$RUNNER_TEMP/glslang" -B "$RUNNER_TEMP/glslang/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glslang-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_CTEST=OFF \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DENABLE_OPT=OFF
          cmake --build "$RUNNER_TEMP/glslang/build" -j$(nproc)
          cmake --install "$RUNNER_TEMP/glslang/build"

      # clang-tidy needs compile_commands.json, which configuring generates.
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/glslang-install"

      - name: Run clang-tidy
        run: |
          clang-tidy -p build --warnings-as-errors='*' \
            $(find src/componeng -name "*.cpp")
        continue-on-error: true
