name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglm-dev \
            xvfb

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run tests
        run: |
          cd build
          xvfb-run ctest --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find include/componeng src/componeng tests example \
          -name "*.hpp" -o -name "*.cpp" | \
          xargs clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          clang-tidy \
          libglfw3-dev \
          libgl1-mesa-dev \
          libglm-dev

    # clang-tidy needs compile_commands.json, which configuring generates.
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

    - name: Run clang-tidy
      run: |
        clang-tidy -p build --warnings-as-errors='*' \
          $(find src/componeng -name "*.cpp")
